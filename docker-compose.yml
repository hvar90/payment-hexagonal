version: '3.8'

services:
  postgres-db:
    image: postgres:15-alpine
    container_name: payment_db
    environment:
      POSTGRES_DB: payment_gateway_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secretpassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - payment-network

volumes:
  postgres_data:

networks:
  payment-network:
    driver: bridge