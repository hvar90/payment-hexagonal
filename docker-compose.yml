version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: payment_postgres
    environment:
      POSTGRES_DB: payment_gateway_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secretpassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - payment-net

  rabbitmq:
    image: rabbitmq:3.11-management-alpine
    container_name: payment_rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"   # Puerto de mensajería AMQP
      - "15672:15672" # Puerto del panel web de administración (http://localhost:15672)
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - payment-net

volumes:
  postgres_data:
  rabbitmq_data:

networks:
  payment-net:
    driver: bridge